name: 🤖 MACHINEBASE 크롤러

on:
  # ── 자동 실행: 매 분기 첫째 날 새벽 2시 (UTC) ──────────
  schedule:
    - cron: '0 2 1 1,4,7,10 *'   # 1월, 4월, 7월, 10월 1일 02:00 UTC
  
  # ── 수동 실행 (GitHub Actions 탭에서 버튼 클릭) ─────────
  workflow_dispatch:
    inputs:
      target:
        description: '크롤링할 제조사'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mazak
          - dmg_mori
          - okuma

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 최대 2시간
    
    steps:
      # ── 1. 코드 체크아웃 ────────────────────────────────
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      # ── 2. Python 설정 ──────────────────────────────────
      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 패키지 설치 ──────────────────────────────────
      - name: 📦 패키지 설치
        run: |
          pip install -r requirements_crawlers.txt
          playwright install chromium
          playwright install-deps chromium

      # ── 4. 크롤러 실행 ──────────────────────────────────
      - name: 🕷️ 크롤러 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          echo "🎯 크롤링 대상: $TARGET"
          python main.py $TARGET

      # ── 5. 결과 알림 (실패 시) ──────────────────────────
      - name: 📢 실패 알림
        if: failure()
        run: |
          echo "❌ 크롤러 실패! GitHub Actions 로그를 확인하세요."
